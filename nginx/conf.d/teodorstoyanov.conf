server {
    listen 80;
    server_name teodorstoyanov.dev www.teodorstoyanov.dev;
    return 301 https://teodorstoyanov.dev$request_uri;
}

server {
    listen 443 ssl;
    server_name www.teodorstoyanov.dev;

    ssl_certificate /etc/letsencrypt/live/teodorstoyanov.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teodorstoyanov.dev/privkey.pem;

    return 301 https://teodorstoyanov.dev$request_uri;
}

server {
    listen 443 ssl;
    server_name teodorstoyanov.dev;

    ssl_certificate /etc/letsencrypt/live/teodorstoyanov.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teodorstoyanov.dev/privkey.pem;

    location / {
        proxy_pass http://172.17.0.1:8092;
        proxy_set_header Host $host;
    }
}
