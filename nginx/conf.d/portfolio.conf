server {
    listen 80;
    server_name portfolio.116.203.149.96.nip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name portfolio.116.203.149.96.nip.io;

    ssl_certificate /etc/letsencrypt/live/portfolio.116.203.149.96.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio.116.203.149.96.nip.io/privkey.pem;

    location / {
        proxy_pass http://172.17.0.1:8092;
        proxy_set_header Host $host;
    }
}
