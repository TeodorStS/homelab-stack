server {
    listen 80;
    server_name ttt.116.203.149.96.nip.io;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name ttt.116.203.149.96.nip.io;
    ssl_certificate /etc/letsencrypt/live/ttt.116.203.149.96.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ttt.116.203.149.96.nip.io/privkey.pem;
    location / {
        proxy_pass http://tictactoe-web-1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
