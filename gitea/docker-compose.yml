services:
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: always
    ports:
      - "3002:3000"
      - "222:22"
    volumes:
      - ./data:/data
    environment:
      - APP_NAME=Homelab Gitea
      - RUN_MODE=prod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
